<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
<style>
  .s { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .float  { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .float2 { animation: float 5s ease-in-out -2s infinite; transform-box: fill-box; transform-origin: center; }
  .sway   { animation: sway 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  .tw     { animation: tw 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .tw2    { animation: tw 2.4s ease-in-out -1.2s infinite; transform-box: fill-box; transform-origin: center; }
  .blink  { animation: blink 1s steps(1) infinite; }
  .steam  { animation: steam 2.6s ease-in-out infinite; }
  .steam2 { animation: steam 2.6s ease-in-out -1.3s infinite; }
  .wiggle { animation: wiggle .6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .crawl  { animation: crawl 9s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @keyframes sway  { 0%,100% { transform: rotate(-5deg) } 50% { transform: rotate(5deg) } }
  @keyframes tw    { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: .35; transform: scale(.7) } }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px) } 40% { opacity: 1 } 100% { opacity: 0; transform: translateY(-10px) } }
  @keyframes wiggle { from { transform: rotate(-6deg) } to { transform: rotate(6deg) } }
  @keyframes crawl { 0%,100% { transform: translateX(0) } 50% { transform: translateX(-26px) } }
</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4a5a44"/><stop offset=".5" stop-color="#6b7d5a"/><stop offset="1" stop-color="#c8693c"/>
  </linearGradient>
</defs>

<!-- bubble -->
<path fill="url(#g)" d="M420 62 C480 30 592 40 632 86 C672 132 662 202 602 226 C542 250 440 246 396 206 C352 166 360 92 420 62 Z">
  <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M420 62 C480 30 592 40 632 86 C672 132 662 202 602 226 C542 250 440 246 396 206 C352 166 360 92 420 62 Z;M410 70 C472 26 600 48 640 94 C676 140 652 206 592 230 C532 252 446 240 400 200 C356 160 350 108 410 70 Z;M420 62 C480 30 592 40 632 86 C672 132 662 202 602 226 C542 250 440 246 396 206 C352 166 360 92 420 62 Z" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
</path>
<text x="500" y="162" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="800" fill="#e6dfcc" letter-spacing="-1">crisD92</text>

<!-- terminal window, left -->
<g class="float">
  <rect class="s" x="70" y="88" width="132" height="86" rx="10" stroke="#9a9886" fill="#252b26"/>
  <path class="s" d="M70 110 H202" stroke="#9a9886"/>
  <circle cx="84" cy="99" r="3.5" fill="#c8693c"/><circle cx="96" cy="99" r="3.5" fill="#d9a441"/><circle cx="108" cy="99" r="3.5" fill="#8fa876"/>
  <path class="s" d="M86 130 l12 10 l-12 10" stroke="#8fa876"/>
  <rect class="blink" x="108" y="146" width="18" height="4" rx="2" fill="#e6dfcc"/>
</g>

<!-- curly braces, top left -->
<g class="float2">
  <path class="s" d="M268 40 c-10 0 -10 4 -10 12 v8 c0 6 -4 8 -8 8 c4 0 8 2 8 8 v8 c0 8 0 12 10 12" stroke="#d9a441"/>
  <path class="s" d="M300 40 c10 0 10 4 10 12 v8 c0 6 4 8 8 8 c-4 0 -8 2 -8 8 v8 c0 8 0 12 -10 12" stroke="#d9a441"/>
</g>

<!-- leaf sprig, bottom left -->
<g class="sway">
  <path class="s" d="M300 262 C300 236 306 214 322 196" stroke="#8fa876"/>
  <path class="s" d="M303 236 C288 232 280 220 282 208 C296 210 304 222 303 236 Z" stroke="#8fa876"/>
  <path class="s" d="M310 214 C322 206 336 208 342 216 C332 226 318 224 310 214 Z" stroke="#8fa876"/>
  <path class="s" d="M322 196 C318 184 322 172 332 168 C338 180 334 192 322 196 Z" stroke="#8fa876"/>
</g>

<!-- squiggle -->
<path class="s" d="M150 228 q10 -12 20 0 t20 0 t20 0 t20 0" stroke="#c8693c"/>

<!-- sparkles -->
<path class="tw"  d="M368 34 q3 12 14 14 q-11 3 -14 14 q-3 -11 -14 -14 q11 -2 14 -14 Z" fill="#d9a441"/>
<path class="tw2" d="M672 236 q2 9 10 10 q-8 2 -10 10 q-2 -8 -10 -10 q8 -1 10 -10 Z" fill="#d9a441"/>
<path class="tw2" d="M40 54 q2 8 9 9 q-7 2 -9 9 q-2 -7 -9 -9 q7 -1 9 -9 Z" fill="#8fa876"/>
<path class="tw"  d="M950 236 q2 8 9 9 q-7 2 -9 9 q-2 -7 -9 -9 q7 -1 9 -9 Z" fill="#c8693c"/>

<!-- tiny circles / plus signs -->
<circle class="tw2" cx="232" cy="52" r="5" fill="none" stroke="#c8693c" stroke-width="2.5"/>
<circle class="tw" cx="712" cy="40" r="4" fill="#8fa876"/>
<circle class="tw2" cx="400" cy="250" r="3.5" fill="#9a9886"/>
<path class="s tw" d="M622 26 v12 M616 32 h12" stroke="#8fa876"/>
<path class="s tw2" d="M222 196 v12 M216 202 h12" stroke="#d9a441"/>

<!-- "hi!" + curly arrow, right -->
<g class="float2">
  <text x="742" y="78" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="28" fill="#c8693c" transform="rotate(-8 742 78)">hi there!</text>
  <path class="s" d="M760 96 C740 122 708 112 716 96 C724 82 742 104 724 128 C716 138 698 144 676 140" stroke="#c8693c"/>
  <path class="s" d="M688 132 l-12 8 l13 6" stroke="#c8693c"/>
</g>

<!-- coffee mug, right -->
<g class="float">
  <path class="s" d="M846 140 h62 v38 c0 16 -12 26 -31 26 c-19 0 -31 -10 -31 -26 Z" stroke="#9a9886" fill="#252b26"/>
  <path class="s" d="M908 152 c18 0 18 26 0 26" stroke="#9a9886"/>
  <path class="s" d="M856 150 h42" stroke="#c8693c" stroke-width="5" opacity=".7"/>
  <path class="s steam"  d="M866 128 c-6 -8 6 -14 0 -24" stroke="#9a9886"/>
  <path class="s steam2" d="M882 128 c-6 -8 6 -14 0 -24" stroke="#9a9886"/>
  <path class="s steam"  d="M898 128 c-6 -8 6 -14 0 -24" stroke="#9a9886"/>
</g>

<!-- a bug, obviously -->
<g class="crawl">
  <g class="wiggle">
    <path class="s" d="M776 236 l-12 -6 M776 246 l-14 0 M778 256 l-12 6 M810 236 l12 -6 M810 246 l14 0 M808 256 l12 6" stroke="#9a9886" stroke-width="2.5"/>
    <ellipse cx="793" cy="246" rx="17" ry="20" fill="#c8693c"/>
    <path d="M793 228 V266" stroke="#252b26" stroke-width="2"/>
    <circle cx="786" cy="242" r="3" fill="#252b26"/><circle cx="800" cy="252" r="3" fill="#252b26"/>
    <circle cx="793" cy="224" r="8" fill="#e6dfcc"/>
    <path class="s" d="M789 218 l-6 -10 M797 218 l6 -10" stroke="#e6dfcc" stroke-width="2.5"/>
  </g>
  <text x="824" y="272" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="15" fill="#9a9886">it's a feature</text>
</g>
</svg>
